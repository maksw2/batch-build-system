name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: build
      shell: cmd
      run: make.cmd --no-wait
    - name: Is file created?
      if: ${{ hashFiles('main.exe') == '' }}
      run: exit 1
